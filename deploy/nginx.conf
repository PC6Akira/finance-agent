# finance-agent Nginx 反代模板（Gradio 前端）
# 使用前把 your-domain.com 全部替换为真实域名。
# 证书建议用 certbot --nginx 签发/续期（步骤见 deploy/README.md）。

# --- HTTP：强制跳转 HTTPS（证书签发/续期时 certbot 会临时接管 80 端口）---
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS：反代到本地 Gradio（127.0.0.1:7860）---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        # Gradio 依赖 WebSocket，这两行必须保留
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式 / 长任务适当放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
